<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Học Sinh - Lớp 12.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ==================== KHU VỰC ĐĂNG NHẬP / ĐĂNG KÝ ==================== -->
  <div id="authContainer" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6">
      
      <div class="text-center">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-3">
          🎓
        </div>
        <h2 class="text-xl font-bold text-slate-800" id="authTitle">Cổng Học Sinh Lớp 12.1</h2>
        <p class="text-xs text-slate-500 mt-1" id="authSub">Học tập và rèn luyện môn Toán cùng Thầy Hậu</p>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="studentLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tài khoản Email Google:</label>
          <input type="email" id="loginEmail" required placeholder="vidu@gmail.com"
                 class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu:</label>
          <input type="password" id="loginPassword" required placeholder="Nhập mật khẩu..."
                 class="w-full border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600">
        </div>

        <p id="loginErrorMsg" class="text-xs text-rose-500 font-semibold hidden"></p>

        <button type="submit" id="btnLoginSubmit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
          Đăng Nhập
        </button>

        <div class="text-center pt-2">
          <button type="button" onclick="toggleAuthMode('register')" class="text-xs text-indigo-600 hover:underline font-semibold">
            Chưa có tài khoản? Đăng ký tại đây
          </button>
        </div>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="studentRegisterForm" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-0.5">Họ và Tên:</label>
          <input type="text" id="regFullName" required placeholder="VD: Nguyễn Văn A"
                 class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-0.5">Lớp:</label>
            <input type="text" id="regClass" required placeholder="VD: 12.1"
                   class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-0.5">Giới tính:</label>
            <select id="regGender" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600 bg-white">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-0.5">Trường:</label>
          <input type="text" id="regSchool" required placeholder="VD: THCS và THPT Lawrence S. Ting"
                 class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-0.5">Số điện thoại:</label>
          <input type="tel" id="regPhone" required placeholder="VD: 0912345678"
                 class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-0.5">Tài khoản Email Google:</label>
          <input type="email" id="regEmail" required placeholder="email@gmail.com"
                 class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-0.5">Mật khẩu (HS tự tạo):</label>
          <input type="password" id="regPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự..."
                 class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-indigo-600">
        </div>

        <p id="regErrorMsg" class="text-xs text-rose-500 font-semibold hidden"></p>
        <p id="regSuccessMsg" class="text-xs text-emerald-600 font-semibold hidden"></p>

        <button type="submit" id="btnRegSubmit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
          Gửi Yêu Cầu Đăng Ký
        </button>

        <div class="text-center pt-2">
          <button type="button" onclick="toggleAuthMode('login')" class="text-xs text-slate-500 hover:underline">
            Đã có tài khoản? Quay lại Đăng nhập
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- ==================== GIAO DIỆN HỌC SINH SAU KHI ĐĂNG NHẬP ==================== -->
  <div id="studentDashboard" class="hidden">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🎓</span>
        <div>
          <h1 class="font-bold text-lg text-slate-800">Cổng Học Sinh - Lớp 12.1</h1>
          <p class="text-xs text-slate-500">Giảng dạy: Thầy Hậu</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <p class="text-xs font-bold text-slate-800" id="headerStudentName">Học sinh</p>
          <p class="text-[11px] text-slate-500" id="headerStudentEmail">email@gmail.com</p>
        </div>
        <button onclick="logoutStudent()" class="text-xs bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 px-3 py-1.5 rounded-lg border border-slate-200 transition font-medium">
          Đăng xuất
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 space-y-6">
      <div class="bg-gradient-to-r from-indigo-600 to-blue-600 rounded-2xl p-6 text-white shadow-md">
        <h2 class="text-xl font-bold mb-1" id="bannerGreeting">Chào em!</h2>
        <p class="text-xs text-indigo-100">Chúc em học tập hiệu quả cùng Thầy Hậu.</p>
      </div>

      <!-- Điều hướng 3 tabs -->
      <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-2 shadow-sm gap-2 overflow-x-auto">
        <button id="tabBtnLecture" onclick="switchMainTab('lecture')" class="py-3 px-5 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition">📖 Bài Giảng</button>
        <button id="tabBtnPractice" onclick="switchMainTab('practice')" class="py-3 px-5 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">📝 Bài Tập & Thi Online</button>
        <button id="tabBtnAttendance" onclick="switchMainTab('attendance')" class="py-3 px-5 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">📅 Chuyên Cần & Đơn Phép</button>
      </div>

      <div id="tabContentLecture" class="space-y-4">
        <div id="lectureListContainer" class="space-y-4"><p class="text-center py-10 text-slate-400 text-sm">Đang tải bài giảng...</p></div>
      </div>

      <div id="tabContentPractice" class="space-y-4 hidden">
        <div id="practiceListContainer" class="space-y-4"><p class="text-center py-10 text-slate-400 text-sm">Đang tải bài tập...</p></div>
      </div>

      <div id="tabContentAttendance" class="space-y-6 hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="space-y-4">
            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
              <h3 class="font-bold text-slate-800 text-sm">Tạo Đơn Xin Phép</h3>
              <form id="leaveRequestForm" class="space-y-3">
                <select id="leaveType" class="w-full border border-slate-300 rounded-lg p-2 text-xs">
                  <option value="absent">Nghỉ học</option>
                  <option value="late">Vào học muộn</option>
                </select>
                <input type="date" id="leaveDate" required class="w-full border border-slate-300 rounded-lg p-2 text-xs">
                <textarea id="leaveReason" rows="3" required placeholder="Lý do..." class="w-full border border-slate-300 rounded-lg p-2 text-xs"></textarea>
                <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Gửi Đơn</button>
              </form>
            </section>
          </div>
          <section class="md:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <h3 class="font-bold text-slate-800 text-sm mb-3">Lịch Sử Chuyên Cần</h3>
            <table class="w-full text-left text-xs">
              <tbody id="myAttendanceHistoryBody"><tr><td class="text-center py-4 text-slate-400">Đang tải...</td></tr></tbody>
            </table>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { getSheetData, postSheetData } from './api.js';

    let currentStudent = null;

    // Chuyển đổi giữa Đăng nhập và Đăng ký
    window.toggleAuthMode = (mode) => {
      const loginF = document.getElementById('studentLoginForm');
      const regF = document.getElementById('studentRegisterForm');
      const title = document.getElementById('authTitle');
      const sub = document.getElementById('authSub');

      if (mode === 'register') {
        loginF.classList.add('hidden');
        regF.classList.remove('hidden');
        title.innerText = "Đăng Ký Tài Khoản Học Sinh";
        sub.innerText = "Điền đầy đủ thông tin để Thầy Hậu phê duyệt";
      } else {
        loginF.classList.remove('hidden');
        regF.classList.add('hidden');
        title.innerText = "Cổng Học Sinh Lớp 12.1";
        sub.innerText = "Học tập và rèn luyện môn Toán cùng Thầy Hậu";
      }
    };

    // Xử lý Đăng ký
    document.getElementById('studentRegisterForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRegSubmit');
      const err = document.getElementById('regErrorMsg');
      const succ = document.getElementById('regSuccessMsg');

      err.classList.add('hidden');
      succ.classList.add('hidden');

      const formData = {
        fullName: document.getElementById('regFullName').value.trim(),
        className: document.getElementById('regClass').value.trim(),
        school: document.getElementById('regSchool').value.trim(),
        gender: document.getElementById('regGender').value,
        phone: document.getElementById('regPhone').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value.trim()
      };

      try {
        btn.innerText = "Đang gửi đăng ký...";
        btn.disabled = true;

        await postSheetData('registerStudent', formData);

        succ.innerText = "🎉 Đăng ký thành công! Vui lòng chờ Thầy Hậu phê duyệt tài khoản của em nhé.";
        succ.classList.remove('hidden');
        document.getElementById('studentRegisterForm').reset();
      } catch (e) {
        err.innerText = e.message || "Lỗi đăng ký, vui lòng thử lại!";
        err.classList.remove('hidden');
      } finally {
        btn.innerText = "Gửi Yêu Cầu Đăng Ký";
        btn.disabled = false;
      }
    };

    // Xử lý Đăng nhập
    document.getElementById('studentLoginForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLoginSubmit');
      const err = document.getElementById('loginErrorMsg');
      err.classList.add('hidden');

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      try {
        btn.innerText = "Đang kiểm tra...";
        btn.disabled = true;

        const student = await getSheetData('studentLogin', { email, password });
        currentStudent = student;
        sessionStorage.setItem('current_student', JSON.stringify(student));

        showDashboard(student);
      } catch (e) {
        err.innerText = e.message;
        err.classList.remove('hidden');
      } finally {
        btn.innerText = "Đăng Nhập";
        btn.disabled = false;
      }
    };

    function showDashboard(s) {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('studentDashboard').classList.remove('hidden');
      document.getElementById('headerStudentName').innerText = s.fullName;
      document.getElementById('headerStudentEmail').innerText = s.email;
      document.getElementById('bannerGreeting').innerText = `Chào em, ${s.fullName}!`;
    }

    window.logoutStudent = () => {
      sessionStorage.removeItem('current_student');
      window.location.reload();
    };

    // Kiểm tra phiên đăng nhập
    const cached = sessionStorage.getItem('current_student');
    if (cached) {
      try {
        currentStudent = JSON.parse(cached);
        showDashboard(currentStudent);
      } catch(e) {}
    }

    window.switchMainTab = (t) => {
      ['lecture', 'practice', 'attendance'].forEach(tab => {
        document.getElementById(`tabContent${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.toggle('hidden', tab !== t);
      });
    };
  </script>
</body>
</html>
